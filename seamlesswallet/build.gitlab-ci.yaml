.build_template_seamlesswallet: &build_template_seamlesswallet
  stage: build
  image: 484907507662.dkr.ecr.ap-northeast-1.amazonaws.com/sre/docker-coreutils:latest
  variables:
    REPO: backend/seamlesswallet

build-seamlesswallet:
  <<: *build_template_seamlesswallet
  tags:
    - ec2-gitlab-runner
  only:
    - /^release.*$/
    - /^feature/.*$/
  script:
    - !reference [.build_to_ecr]
    - docker build -f ThirdPartySeamlessWallet/ThirdPartySeamlessWallet/Dockerfile -t $IMAGE_NAME:$TAG .
    - docker push $IMAGE_NAME:$TAG
    - docker rmi $IMAGE_NAME:$TAG

