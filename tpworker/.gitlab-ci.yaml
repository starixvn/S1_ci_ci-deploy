include:
  - project: "sre/gitlab-ci-configs"
    ref: "main"
    file: "/tpworker/build.gitlab-ci.yaml"
  - project: "sre/gitlab-ci-configs"
    ref: "main"
    file: "/tpworker/deploy-12bet-uat.gitlab-ci.yaml"
  - project: "sre/gitlab-ci-configs"
    ref: "main"
    file: "/templates/ecr-template.yaml"

stages:
  - build
  - deploy-uat
  - deploy-prod

variables:
  PROJECT:
    value: "all"
    options:
      - "all"
      - "commonservice"
      - "seamlesswallet"
      - "settleworker"
      - "thirdpartybethistory"
      - "tpservice"
      - "tpworker"
      - "tpwager"
    description: "please select one service to build & deploy. default is all service in this repo."
  VERSION:
    value: ""
    description: "only for deploy use to rollback version if this variable have value."

