.build_nova_desktop_template: &build_nova_desktop_template
  stage: build
  image: 484907507662.dkr.ecr.ap-northeast-1.amazonaws.com/sre/docker-coreutils:latest
  variables:
    REPO: frontend/nova-desktop

build-nova-desktop:
  <<: *build_nova_desktop_template
  tags:
    - ec2-gitlab-runner
  only:
    - /^release.*$/
    - /^feature/.*$/
  script:
    - !reference [.build_to_ecr]
    -	docker build -f /dockerfile --build-arg project_name=nova-desktop --build-arg port=5073 --build-arg env=dev -t $Img .
    - docker push $IMAGE_NAME:$TAG
    - docker rmi $IMAGE_NAME:$TAG

