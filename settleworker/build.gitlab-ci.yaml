.build_template_settleworker: &build_template_settleworker
  stage: build
  image: 484907507662.dkr.ecr.ap-northeast-1.amazonaws.com/sre/docker-coreutils:latest
  variables:
    REPO: backend/settleworker

build-settleworker:
  <<: *build_template_settleworker
  tags:
    - ec2-gitlab-runner
  only:
    - DEV
  script:
    - !reference [.build_to_ecr]
    - docker build -f ThirdPartySeamlessWallet/ThirdPartySettleWorker/Dockerfile -t $IMAGE_NAME:$TAG .
    - docker push $IMAGE_NAME:$TAG
    - docker rmi $IMAGE_NAME:$TAG

