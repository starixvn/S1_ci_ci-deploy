.deploy_12bet_uat_thirdpartybethistory_template: &deploy_12bet_uat_thirdpartybethistory_template
  stage: deploy-uat
  image: 484907507662.dkr.ecr.ap-northeast-1.amazonaws.com/sre/kubectl:latest
  variables:
    REPO: backend/thirdpartybethistory
  before_script:
    - !reference [.common_variables]
    - NAMESPACE=worker
    - CONTAINER_NAME=thirdpartybethistory
    - echo "variables VERSION=$VERSION"
    - |
      if [ -n "$VERSION" ]; then
        IMAGE_TAG="$IMAGE_NAME:$VERSION"
      else
        IMAGE_TAG="$IMAGE_NAME:$TAG"
      fi
    - echo "set image to - $IMAGE_TAG"

eks-12bet-uat-thirdpartybethistory:
  <<: *deploy_12bet_uat_thirdpartybethistory_template
  tags:
    - eks-12bet-uat
  rules:
    - if: '$CI_COMMIT_BRANCH == "DEV" && ($PROJECT == "thirdpartybethistory" || $PROJECT == "all")'
      when: always 
    # - if: '$CI_COMMIT_BRANCH == "PRD" && ($PROJECT == "thirdpartybethistory" || $PROJECT == "all")'
    #   when: always
    - when: never
  script:
    - DEPLOY_NAME=thirdpartybethistory
    - kubectl set image --namespace $NAMESPACE deployment/$DEPLOY_NAME $CONTAINER_NAME=$IMAGE_TAG
    - kubectl rollout status -n $NAMESPACE deployment/$DEPLOY_NAME --timeout 600s

