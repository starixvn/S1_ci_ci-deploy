.build_template_thirdpartybethistory: &build_template_thirdpartybethistory
  stage: build
  image: 484907507662.dkr.ecr.ap-northeast-1.amazonaws.com/sre/docker-coreutils:latest
  REPO: backend/thirdpartybethistory
  
build-thirdpartybethistory:
  <<: *build_template_thirdpartybethistory
  tags:
    - ec2-gitlab-runner
  only:
    - /^release.*$/
    - /^feature/.*$/
  script:
    - !reference [.build_to_ecr]
    - docker build -f ThirdPartyBetHistory/ThirdPartyBetHistory/Dockerfile -t $IMAGE_NAME:$TAG .
    - docker push $IMAGE_NAME:$TAG
    - docker rmi $IMAGE_NAME:$TAG

