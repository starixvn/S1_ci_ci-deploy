.build_template_paymentworker: &build_template_paymentworker
  stage: build
  image: 484907507662.dkr.ecr.ap-northeast-1.amazonaws.com/sre/docker-coreutils:latest
  variables:
    REPO: backend/paymentworker

build-paymentworker:
  <<: *build_template_paymentworker
  tags:
    - ec2-gitlab-runner
  only:
    - DEV
  script:
    - !reference [.build_to_ecr]
    - docker build -f PaymentService/PaymentService/Dockerfile -t $IMAGE_NAME:$TAG .
    - docker push $IMAGE_NAME:$TAG
    - docker rmi $IMAGE_NAME:$TAG

