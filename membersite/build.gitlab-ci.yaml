.build_membersite_template: &build_membersite_template
  stage: build
  image: 484907507662.dkr.ecr.ap-northeast-1.amazonaws.com/sre/docker-coreutils:latest
  variables:
    REPO: backend/membersite

build-membersite:
  <<: *build_membersite_template
  tags:
    - ec2-gitlab-runner
  only:
    - DEV
  script:
    - !reference [.build_to_ecr]
    - docker build -f MemberSite/MemberSite/Dockerfile -t $IMAGE_NAME:$TAG .
    - docker push $IMAGE_NAME:$TAG
    - docker rmi $IMAGE_NAME:$TAG

