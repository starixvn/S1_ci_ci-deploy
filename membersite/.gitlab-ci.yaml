include:
  - project: "sre/gitlab-ci-configs"
    ref: "main"
    file: "/membersite/build.gitlab-ci.yaml"
  - project: "sre/gitlab-ci-configs"
    ref: "main"
    file: "/membersite/deploy-12bet-uat.gitlab-ci.yaml"
  - project: "sre/gitlab-ci-configs"
    ref: "main"
    file: "/templates/ecr-template.yaml"

stages:
  - build
  - deploy-uat
  - deploy-prod

variables:
  PROJECT:
    value: "all"
    options:
      - "all"
      - "membersite"
      - "membersiteapp"
    description: "please select one service to build & deploy. default is all service in this repo."
  VERSION:
    value: ""
    description: "only for deploy use to rollback version if this variable have value."
