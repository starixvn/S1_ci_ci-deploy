.build_template_storehangfireservice: &build_template_storehangfireservice
  stage: build
  image: 484907507662.dkr.ecr.ap-northeast-1.amazonaws.com/sre/docker-coreutils:latest
  variables:
    REPO: backend/storehangfireservice
    PROJECT: "all"

build-storehangfireservice:
  <<: *build_template_storehangfireservice
  tags:
    - ec2-gitlab-runner
  #only:
  #  - DEV
  rules:
    - if: '$CI_COMMIT_BRANCH == "DEV" && ($PROJECT == "storehangfireservice" || $PROJECT == "all")'
      when: always 
    # - if: '$CI_COMMIT_BRANCH == "PRD" && ($PROJECT == "storehangfireservice" || $PROJECT == "all")'
    #   when: always
    - when: never

  script:
    - !reference [.build_to_ecr]
    - echo "variables PROJECT=${PROJECT}"

    - docker build -f StoreService/StoreHangfireService/Dockerfile -t $IMAGE_NAME:$TAG .
    - echo "Build completed. tag : $IMAGE_NAME:$TAG"
    - docker push $IMAGE_NAME:$TAG
    - docker rmi $IMAGE_NAME:$TAG

