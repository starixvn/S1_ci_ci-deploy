.deploy_12bet_uat_storehangfireservice_template: &deploy_12bet_uat_storehangfireservice_template
  stage: deploy-uat
  image: 484907507662.dkr.ecr.ap-northeast-1.amazonaws.com/sre/kubectl:latest
  variables:
    REPO: backend/storehangfireservice
  before_script:
    - !reference [.common_variables]
    - NAMESPACE=worker
    - CONTAINER_NAME=storehangfireservice
    - echo "set image to - $IMAGE_NAME:$TAG"

eks-12bet-uat-storehangfireservice:
  <<: *deploy_12bet_uat_storehangfireservice_template
  tags:
    - eks-12bet-uat
  rules:
    - if: '$CI_COMMIT_BRANCH == "DEV" && ($PROJECT == "storehangfireservice" || $PROJECT == "all")'
      variables:
        ENV: "dev"
      when: always 
    - if: '$CI_COMMIT_BRANCH == "PRD" && ($PROJECT == "storehangfireservice" || $PROJECT == "all")'
      variables:
        ENV: "prd"
      when: always
    - when: never
  script:
    - DEPLOY_NAME=storehangfireservice
    - kubectl set image --namespace $NAMESPACE deployment/$DEPLOY_NAME $CONTAINER_NAME=$IMAGE_NAME:$TAG
    - kubectl rollout status -n $NAMESPACE deployment/$DEPLOY_NAME --timeout 600s

