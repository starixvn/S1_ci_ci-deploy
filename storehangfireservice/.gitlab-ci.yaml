include:
  - project: "sre/gitlab-ci-configs"
    ref: "main"
    file: "/storehangfireservice/build.gitlab-ci.yaml"
  - project: "sre/gitlab-ci-configs"
    ref: "main"
    file: "/storehangfireservice/deploy-12bet-uat.gitlab-ci.yaml"
  - project: "sre/gitlab-ci-configs"
    ref: "main"
    file: "/templates/ecr-template.yaml"

stages:
  - build
  - deploy-uat
  - deploy-prod

variables:
  PROJECT:
    value: "storeservice"
    options:
      - "storeservice"
      - "hangfirestoreservice"
      - "all"
    description: "please select one brand to build & deploy."

