include:
  - project: "sre/gitlab-ci-configs"
    ref: "main"
    file: "/storehangfireservice/build.gitlab-ci.yaml"
  - project: "sre/gitlab-ci-configs"
    ref: "main"
    file: "/storehangfireservice/deploy-12bet-uat.gitlab-ci.yaml"
  - project: "sre/gitlab-ci-configs"
    ref: "main"
    file: "/templates/ecr-template.yaml"

stages:
  - build
  - deploy-uat
  - deploy-prod

variables:
  PROJECT:
    value: "all"
    options:
      - "all"
      - "storeservice"
      - "storehangfireservice"
    description: "please select one service to build & deploy.default is all."
  VERSION:
    value: ""
    description: "if have value. only for deploy use."

