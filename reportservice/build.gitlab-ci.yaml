.build_template_reportservice: &build_template_reportservice
  stage: build
  image: 484907507662.dkr.ecr.ap-northeast-1.amazonaws.com/sre/docker-coreutils:latest
  REPO: backend/reportservice

build-reportservice:
  <<: *build_template_reportservice
  tags:
    - ec2-gitlab-runner
  only:
    - /^release.*$/
    - /^feature/.*$/
  script:
    - !reference [.build_to_ecr]
    - docker build -f ReportService/ReportService/Dockerfile -t $IMAGE_NAME:$TAG .
    - docker push $IMAGE_NAME:$TAG
    - docker rmi $IMAGE_NAME:$TAG

