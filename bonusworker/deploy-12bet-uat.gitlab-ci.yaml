.deploy_12bet_uat_bonusworker_template: &deploy_12bet_uat_bonusworker_template
  stage: deploy-uat
  image: 484907507662.dkr.ecr.ap-northeast-1.amazonaws.com/sre/kubectl:latest
  REPO: backend/bonusworker
  when: manual
  before_script:
    - !reference [.common_variables]
    - NAMESPACE=worker
    - CONTAINER_NAME=bonusworker
    - echo "set image to - $IMAGE_NAME:$TAG"

eks-12bet-uat-bonusworker:
  <<: *deploy_12bet_uat_bonusworker_template
  tags:
    - eks-12bet-uat
  only:
    - /^release.*$/
    - /^feature/.*$/
  script:
    - DEPLOY_NAME=bonusworker
    - kubectl set image --namespace $NAMESPACE deployment/$DEPLOY_NAME $CONTAINER_NAME=$IMAGE_NAME:$TAG
    - kubectl rollout status -n $NAMESPACE deployment/$DEPLOY_NAME --timeout 600s

