.deploy_12bet_uat_storeservice_template: &deploy_12bet_uat_storeservice_template
  stage: deploy-uat
  image: 484907507662.dkr.ecr.ap-northeast-1.amazonaws.com/sre/kubectl:latest
  variables:
    REPO: backend/storeservice
  before_script:
    - !reference [.common_variables]
    - echo "branch = $CI_COMMIT_BRANCH"
    - echo "variables PROJECT=${PROJECT}"
    - echo "variables PROJECTPORT=${PROJECTPORT}"
    - echo "variables ENV=${ENV}"

    - NAMESPACE=api
    - CONTAINER_NAME=storeservice
    - echo "set image to - $IMAGE_NAME:$TAG"

eks-12bet-uat-storeservice:
  <<: *deploy_12bet_uat_storeservice_template
  tags:
    - eks-12bet-uat
  only:
    - DEV
  script:
    - echo "branch = $CI_COMMIT_BRANCH"
    - echo "variables PROJECT=${PROJECT}"
    - echo "variables PROJECTPORT=${PROJECTPORT}"
    - echo "variables ENV=${ENV}"

    - DEPLOY_NAME=storeservice
    - kubectl set image --namespace $NAMESPACE deployment/$DEPLOY_NAME $CONTAINER_NAME=$IMAGE_NAME:$TAG
    - kubectl rollout status -n $NAMESPACE deployment/$DEPLOY_NAME --timeout 600s

