.build_adminsite_template: &build_adminsite_template
  stage: build
  image: 484907507662.dkr.ecr.ap-northeast-1.amazonaws.com/sre/docker-coreutils:latest
  variables:
    REPO: backend/adminsite

build-adminsite:
  <<: *build_adminsite_template
  tags:
    - ec2-gitlab-runner
  only:
    - DEV
  script:
    - !reference [.build_to_ecr]
    - docker build -f BackendSite/BackendSite/Dockerfile -t $IMAGE_NAME:$TAG .
    - docker push $IMAGE_NAME:$TAG
    - docker rmi $IMAGE_NAME:$TAG

