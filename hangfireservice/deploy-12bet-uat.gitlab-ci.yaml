.deploy_12bet_uat_hangfireservice_template: &deploy_12bet_uat_hangfireservice_template
  stage: deploy-uat
  image: 484907507662.dkr.ecr.ap-northeast-1.amazonaws.com/sre/kubectl:latest
  variables:
    REPO: backend/hangfireservice
  before_script:
    - !reference [.common_variables]
    - NAMESPACE=worker
    - CONTAINER_NAME=hangfireservice
    - echo "set image to - $IMAGE_NAME:$TAG"

eks-12bet-uat-hangfireservice:
  <<: *deploy_12bet_uat_hangfireservice_template
  tags:
    - eks-12bet-uat
  only:
    - DEV
  script:
    - DEPLOY_NAME=hangfireservice
    - kubectl set image --namespace $NAMESPACE deployment/$DEPLOY_NAME $CONTAINER_NAME=$IMAGE_NAME:$TAG
    - kubectl rollout status -n $NAMESPACE deployment/$DEPLOY_NAME --timeout 600s

