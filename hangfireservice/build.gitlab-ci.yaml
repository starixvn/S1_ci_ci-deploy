.build_template_hangfireservice: &build_template_hangfireservice
  stage: build
  image: 484907507662.dkr.ecr.ap-northeast-1.amazonaws.com/sre/docker-coreutils:latest
  variables:
    REPO: backend/hangfireservice

build-hangfireservice:
  <<: *build_template_hangfireservice
  tags:
    - ec2-gitlab-runner
  only:
    - DEV
  script:
    - !reference [.build_to_ecr]
    - docker build -f HangfireService/Dockerfile -t $IMAGE_NAME:$TAG .
    - docker push $IMAGE_NAME:$TAG
    - docker rmi $IMAGE_NAME:$TAG

