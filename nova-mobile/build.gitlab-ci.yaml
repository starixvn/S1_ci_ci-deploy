.build_nova_mobile_template: &build_nova_mobile_template
  stage: build
  image: 484907507662.dkr.ecr.ap-northeast-1.amazonaws.com/sre/docker-coreutils:latest
  REPO: frontend/nova-mobile
  
build-nova-mobile:
  <<: *build_nova_mobile_template
  tags:
    - ec2-gitlab-runner
  only:
    - /^release.*$/
    - /^feature/.*$/
  script:
    - !reference [.build_to_ecr]
    - docker build -f dockerfile -t $IMAGE_NAME:$TAG .
    - docker push $IMAGE_NAME:$TAG
    - docker rmi $IMAGE_NAME:$TAG

